<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Эксперимент — Фосфены</title>
  <link rel="stylesheet" href="css/glass.css">
  <link rel="stylesheet" href="css/experiment.css">
</head>
<body class="experiment-mode">

<canvas id="flashCanvas"></canvas>

<!-- Верхняя панель -->
<div class="exp-header">
  <span class="exp-status" id="expStatus">Подготовка</span>
  <div class="exp-progress-bar">
    <div class="exp-progress-fill" id="expProgressFill"></div>
  </div>
  <span class="exp-timer" id="expTimer">0.0 с</span>
</div>

<!-- Центральная подсказка -->
<div class="center-hint hidden" id="centerHint">
  <h2>Приготовьтесь</h2>
  <p></p>
</div>

<!-- Кнопка "Стоп" -->
<button class="btn btn-stop" id="stopBtn">Стоп</button>

<!-- Финальный экран -->
<div class="finish-overlay hidden" id="finishOverlay">
  <div class="glass finish-card">
    <h2>Эксперимент завершён</h2>
    <p>Откройте глаза. Что вы видели под веками?<br>
       Запомните или запишите описание — оно понадобится на следующем шаге.</p>
    <button class="btn btn-primary" id="finishNextBtn">Продолжить</button>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/stimulus.js"></script>
<script src="js/experiment.js"></script>
</body>
</html>
